name: Publish Omarchy plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "omarchy-plugin/**"
      - "src/fnsync.py"
      - "scripts/build-plugin-runtime.sh"
      - "scripts/fn-sync-plugin-runtime.py"
      - "scripts/sync-plugin-runtime.sh"
      - ".github/workflows/publish-plugin.yml"

permissions:
  contents: read

jobs:
  build-runtime:
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the pinned runtime builder
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.0
      - name: Build standalone plugin controller
        run: ./scripts/build-plugin-runtime.sh "${{ matrix.architecture }}" "$RUNNER_TEMP/plugin-runtime"
      - name: Upload standalone plugin controller
        uses: actions/upload-artifact@v7
        with:
          name: fn-sync-runtime-${{ matrix.architecture }}
          path: ${{ runner.temp }}/plugin-runtime/fn-sync-runtime-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download standalone plugin controllers
        uses: actions/download-artifact@v8
        with:
          pattern: fn-sync-runtime-*
          path: ${{ runner.temp }}/plugin-runtime
          merge-multiple: true
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck qt6-declarative-dev-tools
      - name: Validate the plugin tree
        env:
          FNSYNC_PLUGIN_RUNTIME_DIR: ${{ runner.temp }}/plugin-runtime
        run: |
          ./scripts/sync-plugin-runtime.sh
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/basecamp/omarchy/quattro/bin/omarchy-plugin-validate \
            --output /tmp/omarchy-plugin-validate
          chmod +x /tmp/omarchy-plugin-validate
          /tmp/omarchy-plugin-validate omarchy-plugin
          python3 -m unittest discover -s omarchy-plugin/tests -v
          shellcheck omarchy-plugin/scripts/fn-syncctl
          for qml in omarchy-plugin/BarWidget.qml omarchy-plugin/Panel.qml omarchy-plugin/PanelPageHeader.qml omarchy-plugin/FnSyncIcon.qml; do
            /usr/lib/qt6/bin/qmlformat "$qml" >/dev/null
          done
      - name: Configure the plugin repository deploy key
        env:
          PLUGIN_DEPLOY_KEY: ${{ secrets.PLUGIN_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PLUGIN_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      - name: Publish the plugin subtree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --force omarchy-plugin/runtime
          git commit --message "Bundle FN Sync runtime for plugin release"
          git subtree split --prefix=omarchy-plugin --branch=plugin-release
          git remote add plugin git@github.com:ripple0328/omarchy-fn-sync.git
          git fetch plugin main
          plugin_main=$(git rev-parse refs/remotes/plugin/main)
          git push --force-with-lease=refs/heads/main:"$plugin_main" \
            plugin plugin-release:main
