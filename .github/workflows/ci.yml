name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assemble the standalone plugin runtime
        run: ./scripts/sync-plugin-runtime.sh
      - name: Install lint and coverage tools
        run: python -m pip install --disable-pip-version-check coverage ruff
      - name: Lint Python
        run: ruff check src tests omarchy-plugin/controller omarchy-plugin/scripts omarchy-plugin/tests scripts/fn-sync-plugin-runtime.py
      - name: Run controller and package tests with coverage
        env:
          FNSYNC_COVERAGE_SUBPROCESS: "1"
        run: |
          coverage erase
          coverage run --parallel-mode -m unittest discover -s tests -v
          coverage run --parallel-mode -m unittest discover -s omarchy-plugin/tests -v
          coverage combine
          coverage report
          coverage xml
      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.xml

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Lint shell entry points and installers
        run: |
          shellcheck \
            bin/fn-sync \
            bin/fnsync \
            scripts/build-plugin-runtime.sh \
            scripts/build-packages.sh \
            scripts/ci.sh \
            scripts/demo-fn-syncctl \
            scripts/fn-sync-omarchy-setup \
            scripts/fnsync-omarchy-setup \
            scripts/install-omarchy-bundle.sh \
            scripts/install-omarchy-plugin.sh \
            scripts/install.sh \
            scripts/prepare-aur.sh \
            scripts/release-source.sh \
            scripts/sync-plugin-runtime.sh \
            scripts/verify-package.sh \
            omarchy-plugin/controller/build-runtime.sh \
            omarchy-plugin/scripts/fn-syncctl

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 \
            .github/workflows/ci.yml \
            .github/workflows/publish-aur.yml \
            .github/workflows/publish-plugin.yml \
            .github/workflows/release.yml \
            omarchy-plugin/.github/workflows/test.yml

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Omarchy plugin validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq qt6-declarative-dev-tools
      - name: Download the current Omarchy validator
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/basecamp/omarchy/ed7bae4ac5a570e9df307486e0202fdafcc6ee24/bin/omarchy-plugin-validate \
            --output /tmp/omarchy-plugin-validate
          chmod +x /tmp/omarchy-plugin-validate
      - name: Validate plugin manifest
        run: |
          ./scripts/sync-plugin-runtime.sh
          /tmp/omarchy-plugin-validate omarchy-plugin
      - name: Parse QML
        run: |
          for qml in omarchy-plugin/BarWidget.qml omarchy-plugin/Panel.qml omarchy-plugin/PanelPageHeader.qml omarchy-plugin/FnSyncIcon.qml omarchy-plugin/PlainText.qml omarchy-plugin/PlainTextAction.qml omarchy-plugin/PlainTextDropdown.qml; do
            /usr/lib/qt6/bin/qmlformat "$qml" >/dev/null
          done

  plugin-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install runtime build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq
          python -m pip install --disable-pip-version-check -r omarchy-plugin/controller/requirements-build.txt
      - name: Build the standalone AMD64 controller
        run: ./scripts/build-plugin-runtime.sh amd64 "$RUNNER_TEMP/plugin-runtime"
      - name: Test the plugin without a Python runtime
        env:
          FNSYNC_PLUGIN_RUNTIME_DIR: ${{ runner.temp }}/plugin-runtime
          FNSYNC_PLUGIN_RUNTIME_ARCHES: amd64
        run: |
          ./scripts/sync-plugin-runtime.sh
          test ! -e omarchy-plugin/runtime/fnsync.py
          python -m unittest discover -s omarchy-plugin/tests -v

  rclone-e2e:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Python and rclone
        run: pacman -Syu --noconfirm python rclone
      - name: Exercise real local WebDAV transfers
        run: python3 -m unittest tests.test_rclone_e2e -v

  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install package validation dependencies
        run: pacman -Syu --noconfirm git jq namcap pacman-contrib
      - name: Build as an unprivileged Arch packager
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- ./scripts/build-packages.sh
      - name: Verify package and bundled plugin
        run: ./scripts/verify-package.sh
      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fn-sync-packages
          path: dist/
