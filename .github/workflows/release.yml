name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  plugin-runtime:
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the pinned runtime builder
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.0
      - name: Build standalone plugin controller
        run: ./scripts/build-plugin-runtime.sh "${{ matrix.architecture }}" "$RUNNER_TEMP/plugin-runtime"
      - name: Upload standalone plugin controller
        uses: actions/upload-artifact@v7
        with:
          name: release-plugin-runtime-${{ matrix.architecture }}
          path: ${{ runner.temp }}/plugin-runtime/fn-sync-runtime-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  build:
    needs: plugin-runtime
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install release dependencies
        run: pacman -Syu --noconfirm git jq namcap pacman-contrib
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download standalone plugin controllers
        uses: actions/download-artifact@v8
        with:
          pattern: release-plugin-runtime-*
          path: build/plugin-runtime
          merge-multiple: true
      - name: Verify tag and build release artifacts
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          test -d .git
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env FNSYNC_PLUGIN_RUNTIME_DIR="$GITHUB_WORKSPACE/build/plugin-runtime" ./scripts/build-packages.sh
          runuser -u builder -- ./scripts/release-source.sh "$GITHUB_REF_NAME" "dist/fn-sync-$version.tar.gz"
          runuser -u builder -- ./scripts/prepare-aur.sh "dist/fn-sync-$version.tar.gz" "dist/aur/fn-sync"
          cp "dist/fn-sync-$version.tar.gz" "dist/aur/fn-sync/"
          runuser -u builder -- sh -c 'cd dist/aur/fn-sync && makepkg --verifysource'
          ./scripts/verify-package.sh
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FN sync ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/fn-sync-*.tar.gz \
            dist/fn-sync-*.pkg.tar.zst

  aur:
    if: vars.AUR_PUBLISH_ENABLED == 'true'
    needs: github-release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    environment: aur
    steps:
      - name: Install AUR publishing dependencies
        run: pacman -Syu --noconfirm git openssh
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Configure AUR SSH access
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          ssh_dir="$GITHUB_WORKSPACE/.aur-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
          chmod 600 "$ssh_dir/aur"
          install -m 600 .github/aur-known-hosts "$ssh_dir/known_hosts"
      - name: Publish PKGBUILD and .SRCINFO
        run: |
          export GIT_SSH_COMMAND="ssh -i $GITHUB_WORKSPACE/.aur-ssh/aur -o IdentitiesOnly=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=$GITHUB_WORKSPACE/.aur-ssh/known_hosts -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/fn-sync.git aur-repository
          cp dist/aur/fn-sync/PKGBUILD aur-repository/PKGBUILD
          cp dist/aur/fn-sync/.SRCINFO aur-repository/.SRCINFO
          cp dist/aur/fn-sync/fn-sync.install aur-repository/fn-sync.install
          cd aur-repository
          git config user.name "Qingbo Zhang"
          git config user.email "ripple0328@gmail.com"
          git add -- PKGBUILD .SRCINFO fn-sync.install
          if git diff --cached --quiet; then
            echo "AUR metadata is already current"
            exit 0
          fi
          git commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin master
