name: Test plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck qt6-declarative-dev-tools

      - name: Download the current Omarchy validator
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/basecamp/omarchy/ed7bae4ac5a570e9df307486e0202fdafcc6ee24/bin/omarchy-plugin-validate \
            --output /tmp/omarchy-plugin-validate
          chmod +x /tmp/omarchy-plugin-validate

      - name: Validate manifest and runtime files
        run: /tmp/omarchy-plugin-validate .

      - name: Run plugin tests
        run: python3 -m unittest discover -s tests -v

      - name: Parse QML sources
        run: |
          for qml in BarWidget.qml Panel.qml PanelPageHeader.qml FnSyncIcon.qml PlainText.qml PlainTextAction.qml PlainTextDropdown.qml; do
            /usr/lib/qt6/bin/qmlformat "$qml" >/dev/null
          done

      - name: Lint shell wrapper
        run: shellcheck scripts/fn-syncctl controller/build-runtime.sh
