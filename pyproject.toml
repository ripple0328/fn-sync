[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
  "dist",
  "packaging/arch/pkg",
  "packaging/arch/src",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B904"]

[tool.coverage.run]
branch = true
source = ["src", "omarchy-plugin/scripts"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
